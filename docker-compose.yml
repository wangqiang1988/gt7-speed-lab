services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: speedtrans:latest
    container_name: speedtrans
    restart: unless-stopped
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s